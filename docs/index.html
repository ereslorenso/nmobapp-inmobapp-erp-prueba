<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icon.png">
<style>html,body{margin:0}</style>
</head>
<body>
<title>InmobApp ERP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: sidebar fija 260px + navbar flotante + contenido máx. 1440px (sistema de diseño InmobApp) */
:root{
  --primary:#ec7734;--primary-dark:#d66a2e;--primary-ch:236 119 52;
  --success:#28C76F;--success-ch:40 199 111;
  --warning:#FF9F43;--warning-ch:255 159 67;
  --error:#FF4C51;--error-ch:255 76 81;
  --info:#00BAD1;--info-ch:0 186 209;
  --secondary:#808390;--secondary-ch:128 131 144;
  --violet:#7367F0;--violet-ch:115 103 240;
  --ink:47 43 61;
  --text-1:rgb(var(--ink) / .9);--text-2:rgb(var(--ink) / .7);--text-3:rgb(var(--ink) / .5);
  --divider:rgb(var(--ink) / .12);--input-border:rgb(var(--ink) / .22);
  --hover:rgb(var(--ink) / .06);--selected:rgb(var(--ink) / .08);
  --bg:#F8F7FA;--paper:#FFFFFF;--paper-90:rgb(255 255 255 / .86);
  --shadow-ch:47 43 61;
  --shadow-sm:0 2px 8px rgb(var(--shadow-ch) / .12);--shadow-md:0 3px 12px rgb(var(--shadow-ch) / .14);--shadow-lg:0 4px 18px rgb(var(--shadow-ch) / .16);
  --backdrop:rgb(47 43 61 / .5);
  --toast-bg:#2F2B3D;--toast-fg:#FFFFFF;
  --font:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:225 222 245;--shadow-ch:19 17 32;
  --text-1:rgb(var(--ink) / .9);--text-2:rgb(var(--ink) / .7);--text-3:rgb(var(--ink) / .5);
  --divider:rgb(var(--ink) / .12);--input-border:rgb(var(--ink) / .22);
  --hover:rgb(var(--ink) / .06);--selected:rgb(var(--ink) / .08);
  --bg:#25293C;--paper:#2F3349;--paper-90:rgb(47 51 73 / .86);
  --shadow-sm:0 2px 8px rgb(19 17 32 / .18);--shadow-md:0 3px 12px rgb(19 17 32 / .2);--shadow-lg:0 4px 18px rgb(19 17 32 / .22);
  --backdrop:rgb(23 25 37 / .6);--toast-bg:#F7F4FF;--toast-fg:#2F3349;color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:225 222 245;--shadow-ch:19 17 32;
  --text-1:rgb(var(--ink) / .9);--text-2:rgb(var(--ink) / .7);--text-3:rgb(var(--ink) / .5);
  --divider:rgb(var(--ink) / .12);--input-border:rgb(var(--ink) / .22);
  --hover:rgb(var(--ink) / .06);--selected:rgb(var(--ink) / .08);
  --bg:#25293C;--paper:#2F3349;--paper-90:rgb(47 51 73 / .86);
  --shadow-sm:0 2px 8px rgb(19 17 32 / .18);--shadow-md:0 3px 12px rgb(19 17 32 / .2);--shadow-lg:0 4px 18px rgb(19 17 32 / .22);
  --backdrop:rgb(23 25 37 / .6);--toast-bg:#F7F4FF;--toast-fg:#2F3349;color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text-2);font-family:var(--font);font-size:15px;line-height:1.47}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
svg.ic{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}

.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--paper);box-shadow:var(--shadow-sm);padding:16px 14px 16px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px;z-index:5}
.logo{display:flex;align-items:center;gap:10px;padding:6px 10px 16px;color:var(--text-1);font-weight:700;font-size:22px;letter-spacing:.25px}
.mark{width:30px;height:30px;border-radius:8px;background:var(--primary);display:grid;place-items:center;color:#fff;font-size:18px;font-weight:700}
.logo small{display:block;font-size:12px;font-weight:500;letter-spacing:.6px;color:var(--text-3);text-transform:uppercase;margin-top:-2px}
.navsec{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--text-3);padding:14px 12px 6px}
.navi{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;border:0;background:none;cursor:pointer;color:var(--text-1);text-align:left;font-size:15px;transition:background .15s var(--ease);width:100%}
.navi svg.ic{font-size:21px}
.navi .badge{margin-left:auto;background:rgb(var(--error-ch) / .16);color:rgb(var(--error-ch));border-radius:10px;font-size:12px;padding:0 7px;font-weight:600}
.navi:hover{background:var(--hover)}
.navi[aria-current="page"]{background:linear-gradient(270deg,rgb(var(--primary-ch) / .7),var(--primary));color:#fff;box-shadow:0 2px 6px rgb(var(--primary-ch) / .3)}
.navi[aria-current="page"] .badge{background:#fff;color:var(--primary)}

.main{min-width:0;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:0 32px;display:flex;flex-direction:column;gap:22px;max-width:1488px;width:100%;margin:0 auto}
.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;margin-top:12px;background:var(--paper-90);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:var(--shadow-sm);border-radius:6px;min-height:54px;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.navbar .brand-m{display:none;align-items:center;gap:8px;color:var(--text-1);font-weight:700}
.navbar .brand-m .mark{width:26px;height:26px;font-size:15px}
.navbar .sp{flex:1}
.ratechip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--divider);border-radius:6px;padding:4px 6px 4px 10px;color:var(--text-1);font-size:14px;white-space:nowrap}
.ratechip select{border:0;background:transparent;color:var(--text-1);font-weight:600;cursor:pointer;padding:2px}
.ratechip .val{font-weight:600}
.ratechip .stale{color:rgb(var(--warning-ch));font-size:12px}
.mnav{display:none;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;width:100%;order:3}
.mnav .navi{white-space:nowrap;padding:6px 12px;font-size:14px;width:auto}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head h1{margin:0;font-size:24px;font-weight:500;color:var(--text-1);line-height:1.4;text-wrap:balance}
.head p{margin:2px 0 0;font-size:15px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:6px;border:0;cursor:pointer;padding:8px 18px;font-size:15px;font-weight:500;line-height:1.47;transition:background .15s var(--ease),transform .1s;white-space:nowrap;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.navi:focus-visible,select:focus-visible,input:focus-visible,.link:focus-visible,.pcard:focus-visible,.seg button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.btn-p{background:var(--primary);color:#fff;box-shadow:0 2px 6px rgb(var(--primary-ch) / .3)}
.btn-p:hover{background:var(--primary-dark)}
.btn-t{background:rgb(var(--primary-ch) / .16);color:var(--primary)}
.btn-t:hover{background:rgb(var(--primary-ch) / .24)}
.btn-o{background:transparent;color:var(--text-1);border:1px solid var(--input-border)}
.btn-o:hover{background:var(--hover)}
.btn-e{background:var(--error);color:#fff}
.btn-sm{padding:5px 12px;font-size:13px}
.btn-lg{padding:12px 22px;font-size:16px}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{border:0;background:none;cursor:pointer;color:var(--text-3);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:18px;vertical-align:middle}
.iconbtn:hover{background:var(--hover);color:var(--text-1)}
.iconbtn.del:hover{color:rgb(var(--error-ch))}
.link{border:0;background:none;padding:0;color:var(--primary);cursor:pointer;font-weight:500;font-size:inherit}

.kpis{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:20px}
.kpi{background:var(--paper);border-radius:6px;box-shadow:var(--shadow-md);padding:18px 20px;display:flex;flex-direction:column;gap:12px;border-bottom:2px solid rgb(var(--c) / .38);transition:border-color .2s;min-width:0}
.kpi:hover{border-bottom-color:rgb(var(--c))}
.kpi .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi .t{font-size:14px;color:var(--text-2)}
.kpi .v{font-size:22px;font-weight:600;color:var(--text-1);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:13px;color:var(--text-3);margin-top:2px}
.kpi .av{width:36px;height:36px;border-radius:6px;display:grid;place-items:center;font-size:21px;background:rgb(var(--c) / .16);color:rgb(var(--c));flex:none}
.kpi.hero{background:linear-gradient(135deg,var(--primary),#f09558);border:0}
.kpi.hero .t,.kpi.hero .v,.kpi.hero .s{color:#fff}
.kpi.hero .av{background:rgb(255 255 255 / .22);color:#fff}
.kpi.hero .delta{background:rgb(255 255 255 / .22);color:#fff}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;border-radius:4px;padding:1px 6px;background:rgb(var(--c) / .16);color:rgb(var(--c))}
.c-primary{--c:var(--primary-ch)}.c-success{--c:var(--success-ch)}.c-error{--c:var(--error-ch)}.c-info{--c:var(--info-ch)}.c-warning{--c:var(--warning-ch)}.c-secondary{--c:var(--secondary-ch)}.c-violet{--c:var(--violet-ch)}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.card{background:var(--paper);border-radius:6px;box-shadow:var(--shadow-md);min-width:0}
.card-h{padding:18px 22px 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.card-h h2{margin:0;font-size:18px;font-weight:500;color:var(--text-1)}
.card-h p{margin:2px 0 0;font-size:13px;color:var(--text-3)}
.card-b{padding:0 22px 20px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:500;color:var(--text-1);padding:11px 14px;border-top:1px solid var(--divider);border-bottom:1px solid var(--divider);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--divider);white-space:nowrap;vertical-align:middle}
tbody tr:hover{background:var(--hover)}
tr.tot td{font-weight:700;color:var(--text-1);background:var(--selected)}
td.r,th.r{text-align:right}
td.main-c{color:var(--text-1);font-weight:500;white-space:normal;min-width:150px}
td .sub,.sub{display:block;font-size:12px;color:var(--text-3);font-weight:400}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:2px 9px;font-size:12.5px;font-weight:500;background:rgb(var(--c) / .16);color:rgb(var(--c));white-space:nowrap}
.pos{color:rgb(var(--success-ch))}.neg{color:rgb(var(--error-ch))}
.empty{padding:26px 22px;text-align:center;color:var(--text-3);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 22px;border-top:1px solid var(--divider);font-size:14px}
.li .n{color:var(--text-1);font-weight:500;min-width:0}
.kv{display:flex;justify-content:space-between;gap:10px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--divider);overflow-x:auto;scrollbar-width:none;padding:0 10px}
.tabs button{border:0;background:none;padding:12px 14px;cursor:pointer;color:var(--text-2);font-size:15px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--input-border);border-radius:6px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 14px;cursor:pointer;color:var(--text-1);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--primary);color:#fff}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.flabel{font-size:13px;color:var(--text-1)}
.inp{border:1px solid var(--input-border);border-radius:6px;background:var(--paper);padding:8px 12px;font-size:15px;color:var(--text-1);min-width:0;width:100%;transition:border-color .15s}
.inp:hover{border-color:rgb(var(--ink) / .6)}
.inp:focus{outline:none;border:2px solid var(--primary);padding:7px 11px;box-shadow:0 2px 6px rgb(var(--primary-ch) / .3)}
.inp:disabled{opacity:.6}
textarea.inp{resize:vertical;min-height:64px}
.filters .inp{width:auto;padding:6px 10px;font-size:14px}
.filters .inp:focus{padding:5px 9px}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;color:var(--text-1);user-select:none}
.sw input{appearance:none;-webkit-appearance:none;width:36px;height:20px;border-radius:10px;background:rgb(var(--ink) / .22);position:relative;cursor:pointer;transition:background .15s;margin:0;flex:none}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s var(--ease);box-shadow:0 1px 2px rgb(0 0 0 / .2)}
.sw input:checked{background:var(--primary)}
.sw input:checked::after{transform:translateX(16px)}

.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-radius:6px;padding:11px 16px;font-size:14px;background:rgb(var(--c) / .14);color:var(--text-1)}
.banner svg.ic{font-size:20px;color:rgb(var(--c))}
.banner .grow{flex:1;min-width:200px}

.accts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.acct{border:1px solid var(--divider);border-radius:8px;background:var(--paper);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-sm)}
.acct .bd{padding:16px 18px;display:flex;flex-direction:column;gap:4px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.acct .n{color:var(--primary);font-weight:600;display:flex;align-items:center;gap:8px}
.acct .n .bk{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:15px}
.acct .b{font-size:22px;font-weight:600;color:var(--text-1)}
.acct .e{font-size:13px;color:var(--text-3);min-height:19px}
.acct .mt{background:var(--selected);padding:10px 18px 12px;display:flex;flex-direction:column;gap:6px;font-size:13px;margin-top:auto}
.acct .mt .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.acct.sel{border:2px solid var(--primary)}

/* POS */
.pos-wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
.cats{display:flex;gap:8px;flex-wrap:wrap}
.cats button{border:1px solid var(--divider);background:var(--paper);border-radius:16px;padding:5px 14px;cursor:pointer;font-size:14px;color:var(--text-1)}
.cats button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.pcard{background:var(--paper);border:1px solid var(--divider);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;position:relative;transition:box-shadow .15s,transform .15s;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.pcard:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.pcard .pn{color:var(--text-1);font-weight:500;font-size:14.5px;line-height:1.35;min-height:39px}
.pcard .pp{font-weight:700;color:var(--primary);font-size:16px}
.pcard .ps{font-size:12px;color:var(--text-3);display:flex;justify-content:space-between;gap:6px;padding-right:22px}
.pcard .qb{position:absolute;top:10px;right:10px;background:var(--primary);color:#fff;border-radius:10px;font-size:12px;font-weight:700;padding:0 7px}
.pcard[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.cart{position:sticky;top:calc(80px + env(safe-area-inset-top,0px))}
.cline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:10px 20px;border-top:1px solid var(--divider);font-size:14px;align-items:center}
.cline .n{color:var(--text-1);font-weight:500}
.qty{display:inline-flex;align-items:center;border:1px solid var(--input-border);border-radius:6px;justify-self:start}
.qty button{border:0;background:none;width:28px;height:28px;cursor:pointer;color:var(--text-1);font-size:16px}
.qty span{min-width:26px;text-align:center;font-weight:600;color:var(--text-1)}
.totals{padding:14px 20px;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--divider);font-size:14px}
.totals .row{display:flex;justify-content:space-between;gap:10px}
.totals .big{font-size:22px;font-weight:700;color:var(--primary)}
.co{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.payline{display:grid;grid-template-columns:22px minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;padding:10px;border:1px solid var(--divider);border-radius:8px}
.payline .pn{width:22px;height:22px;border-radius:5px;background:var(--primary);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.payline .rf{grid-column:2/-1}
.pair{display:flex;align-items:center;border:1px solid var(--input-border);border-radius:6px;overflow:hidden;background:var(--paper);min-width:0}
.pair span{padding:0 8px;font-size:13px;color:var(--text-3);background:var(--selected);align-self:stretch;display:grid;place-items:center}
.pair .inp{border:0;border-radius:0;text-align:right}
.pair .inp:focus{border:0;padding:8px 12px;box-shadow:inset 0 0 0 2px var(--primary)}
.lines{display:flex;flex-direction:column;gap:10px}
.lcount{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--text-1);flex-wrap:wrap}
.lcount button{width:34px;height:30px;border:1px solid var(--input-border);border-radius:6px;background:var(--paper);cursor:pointer;color:var(--text-1)}
.lcount button[aria-pressed="true"]{border:2px solid var(--primary);color:var(--primary);font-weight:700}
.status{border-radius:6px;padding:10px 14px;font-size:14px;font-weight:500;background:rgb(var(--c) / .14);color:var(--text-1)}
.done{display:flex;flex-direction:column;align-items:center;gap:14px;padding:32px 22px;text-align:center}
.done .ok{width:72px;height:72px;border-radius:50%;background:var(--success);color:#fff;display:grid;place-items:center;font-size:38px;box-shadow:0 4px 16px rgb(var(--success-ch) / .4)}
.done h2{margin:0;font-size:24px;font-weight:600;color:var(--text-1)}
.done .sum{background:var(--selected);border-radius:8px;padding:16px 22px;display:grid;grid-template-columns:1fr 1fr;gap:10px 30px;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.done .sum b{display:block;font-size:16px;text-transform:none;letter-spacing:0;color:var(--text-1)}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--text-3);font-size:12px;font-family:var(--font)}
.legend{display:flex;gap:14px;font-size:13px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

.scrim{position:fixed;inset:0;background:var(--backdrop);z-index:20;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--paper);border-radius:8px;box-shadow:var(--shadow-lg);width:min(620px,100%);max-height:100%;overflow:auto;padding:22px}
.dialog form{display:flex;flex-direction:column;gap:14px}
.dialog h3{margin:0;font-size:19px;font-weight:500;color:var(--text-1)}
.dialog .hint{font-size:13px;color:var(--text-3);margin:-6px 0 0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid .full{grid-column:1/-1}
.preview{border-radius:6px;background:var(--selected);padding:10px 14px;font-size:14px;color:var(--text-1);display:block}
.dlg-a{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.err{color:rgb(var(--error-ch));font-size:13px;margin:0}
.radios{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.radios label{border:1px solid var(--input-border);border-radius:8px;padding:11px 14px;display:flex;gap:10px;align-items:center;cursor:pointer;color:var(--text-1);font-weight:500;font-size:14.5px}
.radios label:has(input:checked){border:2px solid var(--primary);padding:10px 13px}
.radios input{accent-color:var(--primary)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--toast-bg);color:var(--toast-fg);padding:10px 18px;border-radius:6px;font-size:14px;z-index:30;box-shadow:var(--shadow-lg);max-width:calc(100% - 32px)}

.bell{position:relative;color:var(--text-1);font-size:21px}
.bdot{position:absolute;top:0;right:-2px;background:var(--error);color:#fff;border-radius:9px;font-size:11px;font-weight:700;line-height:16px;min-width:16px;padding:0 4px}
.gantt{display:grid;grid-auto-rows:44px;min-width:820px;border:1px solid var(--divider);border-radius:8px;overflow:hidden}
.gantt .gh{grid-row:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--text-3);border-bottom:1px solid var(--divider);background:var(--selected);line-height:1.15}
.gantt .gh b{font-size:13px;color:var(--text-1)}
.gantt .gh.today{background:rgb(var(--primary-ch) / .16)}.gantt .gh.today b{color:var(--primary)}
.gantt .gl{grid-column:1;display:flex;flex-direction:column;justify-content:center;padding:0 12px;border-bottom:1px solid var(--divider);font-size:13.5px;min-width:0;background:var(--paper);z-index:1}
.gantt .gl .link{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gantt .gc{border-left:1px solid var(--divider);border-bottom:1px solid var(--divider)}
.gantt .gc.today{background:rgb(var(--primary-ch) / .07)}
.gantt .gb{margin:8px 2px;border:0;border-radius:6px;color:#fff;font-size:12px;font-weight:600;padding:0 8px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;z-index:2;box-shadow:var(--shadow-sm)}
.gantt .gx{display:grid;place-items:end;padding:4px;color:rgb(var(--warning-ch));font-size:14px;z-index:3;pointer-events:none}
@media (max-width:1280px){.kpis{--n:2!important}.kpis.k3{--n:3!important}.pos-wrap{grid-template-columns:minmax(0,1fr) 340px}}
@media (max-width:1100px){.grid2,.co{grid-template-columns:minmax(0,1fr)}.pos-wrap{grid-template-columns:minmax(0,1fr)}.cart{position:static}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:18px}
  .navbar .brand-m{display:inline-flex}
  .mnav{display:flex}

@media (max-width:600px){

  .capgrid{grid-template-columns:minmax(0,1fr)!important}
}

function depInfo(a,asOfYM){
  const life=Math.max(1,+a.lifeMonths||1),base=Math.max(0,(a.costUsd||0)-(a.residualUsd||0)),monthly=base/life;
  let end=asOfYM;if(a.status==="baja"&&a.bajaDate&&ymOf(a.bajaDate)<end)end=ymOf(a.bajaDate);
  const months=Math.max(0,Math.min(life,ym2n(end)-ym2n(ymOf(a.purchaseDate))));
  return {monthly,months,acc:r2(monthly*months),book:r2((a.costUsd||0)-monthly*months),life};

function ledger(to,from){const m={};for(const e of journal()){if(e.date>to||(from&&e.date<from))continue;for(const l of e.lines){m[l.a]=(m[l.a]||0)+l.d-l.c;}}return m;}
function difCambiario(){let t=0;const L=ledger(todayStr());for(const a of S.accounts){if(a.currency!=="VES")continue;const r=R();if(!r)continue;t+=balance(a)/r-(L[bankCode(a.id)]||0);}return r2(t);}
function balanceSheet(){
  const L=ledger(todayStr()),dif=difCambiario();const sum=p=>Object.entries(L).filter(([k])=>k.startsWith(p)).reduce((s,[,v])=>s+v,0);
  const bank=sum("1.1.01")+dif,act=sum("1")+dif,pas=-sum("2"),res=-(sum("4")+sum("5"));
  const eq={cap:-(L["3.1.01"]||0),aj:-(L["3.1.03"]||0),res,dif};
  return {L,bank,act,pas,eq,pat:eq.cap+eq.aj+eq.res+eq.dif,sum};
}
function pl(from,to){
  let ventas=0,alq=0,com=0,otros=0,costo=0,gastos=0,dep=0,mermas=0;const byCat={};
  for(const e of journal()){if(!inRange(e.date,from,to))continue;for(const l of e.lines){const a=l.a,cr=l.c-l.d,db=l.d-l.c;
    if(a==="4.1.01")ventas+=cr;else if(a==="4.1.02")alq+=cr;else if(a==="4.1.03")com+=cr;else if(a==="4.1.04")otros+=cr;
    else if(a==="5.1.01")costo+=db;else if(a.startsWith("5.2.")){gastos+=db;byCat[a]=(byCat[a]||0)+db;}else if(a==="5.3.01")dep+=db;else if(a.startsWith("5.4."))mermas+=db;}}

  const fijos=S.expenses.filter(e=>e.kind==="fijo"&&inRange(e.date,from,to)).reduce((t,e)=>t+(e.amountUsd||0)-(e.ivaUsd||0),0);
  const facturado=sales.reduce((t,s)=>t+(s.total||0),0);

}

function niceStep(x){if(x<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(x)));const f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p;}

function barChart(labels,series,hl){
  const all=series.flatMap(s=>s.data);const max=Math.max(1,...all),min=Math.min(0,...all);
  const step=niceStep((max-min)/4)||1,top=Math.ceil(max/step)*step,bot=Math.floor(min/step)*step;

  let g="";for(let v=bot;v<=top+1e-9;v+=step){g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--divider)"${Math.abs(v)<1e-9?' stroke-width="1.5"':""}/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${short(v)}</text>`;}
  labels.forEach((lab,i)=>{const cx=L+cw*i+cw/2,x0=cx-(k*bw+(k-1)*3)/2;
    series.forEach((s,j)=>{const v=s.data[i];if(!v)return;const ya=y(Math.max(v,0)),yb=y(Math.min(v,0));

}
function donut(parts){

    const b=a+f*2*Math.PI,lg=f>.5?1:0,pt=(rad,ang)=>[C+rad*Math.cos(ang),C+rad*Math.sin(ang)];
    const [x1,y1]=pt(Rr,a),[x2,y2]=pt(Rr,b),[x3,y3]=pt(r,b),[x4,y4]=pt(r,a);
    g+=`<path d="M${x1} ${y1}A${Rr} ${Rr} 0 ${lg} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${lg} 0 ${x4} ${y4}Z" fill="${p.color}"><title>${p.n}: ${usd(p.v)}</title></path>`;a=b;}
  return `<div style="display:flex;gap:22px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 140 140" width="150" height="150" role="img" aria-label="Composición de activos">${g}</svg><div class="legend" style="flex-direction:column;gap:10px">${parts.map(p=>`<span><i style="background:${p.color}"></i>${p.n} · <b class="num" style="color:var(--text-1)">${fmt(Math.max(0,p.v)/tot*100,1)} %</b></span>`).join("")}</div></div>`;
}

/* ---------- Vender (POS) ---------- */
function posTotals(p){
  const sub=p.cart.reduce((t,l)=>t+l.qty*l.price,0);
  const disc=Math.max(0,parseNum(p.discount)||0),ext=Math.max(0,parseNum(p.extras)||0);
  const base=Math.max(0,sub-disc+ext),co=company();
  const ivaR=(co.iva??16)/100,igR=(co.igtf??3)/100;
  const iva=p.iva?base*ivaR:0,igtf=p.igtf?(base+iva)*igR:0;
  const cost=p.cart.reduce((t,l)=>t+l.qty*(l.cost||0),0);
  return {sub:r2(sub),disc:r2(disc),ext:r2(ext),base:r2(base),iva:r2(iva),igtf:r2(igtf),total:r2(base+iva+igtf),cost:r2(cost)};
}

function readLines(root,pre){
  const out=[];for(let i=0;i<4;i++){const k=root.querySelector("#"+pre+"k"+i);if(!k)break;
    out.push({key:k.value,usd:root.querySelector("#"+pre+"u"+i).value,bs:root.querySelector("#"+pre+"b"+i).value,ref:root.querySelector("#"+pre+"r"+i).value});}
  return out;
}
function syncLine(root,e,pre,rate){
  const m=e&&e.target&&e.target.id?new RegExp("^"+pre+"([ub])(\\d)$").exec(e.target.id):null;if(!m||!rate)return;
  const i=m[2],u=root.querySelector("#"+pre+"u"+i),b=root.querySelector("#"+pre+"b"+i);
  if(m[1]==="u"){const v=parseNum(u.value);b.value=Number.isFinite(v)?fin(v*rate):"";}
  else{const v=parseNum(b.value);u.value=Number.isFinite(v)?fin(v/rate):"";}
}
function autofillLine(root,e,pre,rate,remaining){
  if(!e||!e.target||!new RegExp("^"+pre+"k\\d$").test(e.target.id||""))return;
  const i=e.target.id.slice(-1),u=root.querySelector("#"+pre+"u"+i),b=root.querySelector("#"+pre+"b"+i);
  if(e.target.value&&!(parseNum(u.value)>0)&&remaining>0.004){u.value=fin(remaining);b.value=rate?fin(remaining*rate):"";}
}
function parseLines(lines,rate){
  const out=[];
  for(const l of lines){const u=parseNum(l.usd);if(!(u>0))continue;if(!l.key)throw uerr("Elige el método de pago de cada línea con monto.");
    const [aid,...mm]=l.key.split("|");const a=acctById(aid);if(!a)throw uerr("La cuenta de un método de pago ya no existe.");
    let amount=u;if(a.currency==="VES"){const b=parseNum(l.bs);if(!(rate>0)&&!(b>0))throw uerr("Para pagos en Bs hace falta la tasa del día.");amount=b>0?b:u*rate;}
    out.push({accountId:a.id,method:mm.join("|"),usd:r2(u),amount:r2(amount),rate:rate||null,ref:String(l.ref||"").trim()});}
  return out;
}

/* ================= administración de inmuebles: cálculos ================= */
const propById=id=>S.properties.find(p=>p.id===id);
const ownerById=id=>S.owners.find(o=>o.id===id);
const contractById=id=>S.contracts.find(c=>c.id===id);
const empById=id=>S.employees.find(e=>e.id===id);
const ownerName=p=>p&&p.ownerId?((ownerById(p.ownerId)||{}).name||"Propietario"):"Propiedad de la empresa";
const paidOf=x=>(x.payments||[]).reduce((t,p)=>t+(p.usd||0),0);
const saldoOf=(x,f)=>r2((x[f||"amountUsd"]||0)-paidOf(x));
const propExtra=(p,kind)=>({propertyId:p.id,ownerId:p.ownerId||null,third:!!p.ownerId,commPct:p.commissionPct||0,kind});
const liveContract=(c,ym)=>c.status!=="terminado"&&ymOf(c.start)<=ym&&ymOf(c.end)>=ym;
function rentFor(c,ym){const y=Math.floor((ym2n(ym)-ym2n(ymOf(c.start)))/12);return r2((c.rentUsd||0)*Math.pow(1+(c.adjPct||0)/100,Math.max(0,y)));}
function contractState(c){if(c.status==="terminado")return ["Terminado","secondary"];const t=todayStr();if(c.start>t)return ["Por iniciar","info"];if(c.end<t)return ["Vencido","error"];const d=daysBetween(t,c.end);return d<=60?["Vence en "+d+" d","warning"]:["Vigente","success"];}
const propContract=(pid,date)=>{date=date||todayStr();return S.contracts.find(c=>c.propertyId===pid&&c.status!=="terminado"&&c.start<=date&&c.end>=date);};
const bookingOn=(pid,date)=>S.bookings.find(b=>b.propertyId===pid&&b.status!=="cancelada"&&b.checkIn<=date&&b.checkOut>date);
function nightsIn(b,from,to){const a=b.checkIn>from?b.checkIn:from,z=b.checkOut<addDays(to,1)?b.checkOut:addDays(to,1);return Math.max(0,daysBetween(a,z));}
function propOccupancy(p,ym){
  if(p.status==="bloqueado")return 0;
  if(p.mode==="largo")return S.contracts.some(c=>c.propertyId===p.id&&liveContract(c,ym))?1:0;
  const from=ym+"-01",end=monthEndD(ym),to=ym===ymOf(todayStr())?todayStr():end,days=Math.max(1,daysBetween(from,to)+1);
  return Math.min(1,S.bookings.filter(b=>b.propertyId===p.id&&b.status!=="cancelada").reduce((t,b)=>t+nightsIn(b,from,to),0)/days);
}
function propStatus(p){if(p.status==="bloqueado")return ["Bloqueado","secondary"];if(p.mode==="largo")return propContract(p.id)?["Ocupado","success"]:["Vacante","warning"];return bookingOn(p.id,todayStr())?["Ocupado","success"]:["Disponible","info"];}
function monthlyRent(p,ym){
  if(p.mode==="largo"){const c=S.contracts.find(c=>c.propertyId===p.id&&liveContract(c,ym));return c?rentFor(c,ym):0;}
  const from=ym+"-01",to=monthEndD(ym);
  return S.bookings.filter(b=>b.propertyId===p.id&&b.status!=="cancelada"&&b.checkIn<=to&&b.checkOut>from).reduce((t,b)=>t+(b.nights?(b.totalUsd||0)*nightsIn(b,from,to)/b.nights:0),0);
}
function morosidad(){const t=todayStr(),due=S.charges.filter(c=>c.dueDate<t),tot=due.reduce((s,c)=>s+(c.amountUsd||0),0),pend=due.reduce((s,c)=>s+Math.max(0,saldoOf(c)),0);return {tot,pend,pct:tot?pend/tot:0};}
const isOwnerFund=m=>(m.source==="canon"||m.source==="reserva")&&m.third&&m.kind!=="reembolso";
function ownerPeriod(oid,ym){
  const [a,b]=monthRange(ym);let cobr=0,cond=0,com=0,ot=0;const lines=[];
  for(const m of S.movements){if(m.ownerId!==oid||!inRange(m.date,a,b))continue;
    if(isOwnerFund(m)){if(m.kind==="condominio")cond+=m.usd;else{cobr+=m.usd;com+=r2(m.usd*(m.commPct||0)/100);}lines.push(m);}
    else if(m.source==="ot"&&m.chargeTo==="propietario"){ot+=m.usd;lines.push(m);}}
  return {cobr:r2(cobr),cond:r2(cond),com:r2(com),ot:r2(ot),net:r2(cobr+cond-com-ot),liq:S.liquidations.find(l=>l.ownerId===oid&&l.period===ym),lines};
}

async function pdfReport(filename,title,subtitle,sections){
  if(!S.downloads)return;if(!window.jspdf){toast("No se pudo cargar el generador de PDF. Recarga la página.");return;}
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:"mm",format:"letter"}),co=company(),W=216,M=16;let y=18;
  const brk=h=>{if(y+h>265){doc.addPage();y=18;}};
  doc.setFont("helvetica","bold");doc.setFontSize(14);doc.text(co.name||"Mi empresa",M,y);doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(110);
  doc.text([co.rif?"RIF "+co.rif:"",co.phone?"Tel. "+co.phone:""].filter(Boolean).join(" · "),W-M,y,{align:"right"});y+=8;doc.setTextColor(0);
  doc.setFont("helvetica","bold");doc.setFontSize(13);doc.text(title,M,y);y+=6;doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(90);doc.text(doc.splitTextToSize(subtitle,W-2*M),M,y);y+=8;doc.setTextColor(0);
  for(const s of sections){
    if(s.h){brk(10);doc.setFont("helvetica","bold");doc.setFontSize(11);doc.text(s.h,M,y);y+=6;}
    doc.setFontSize(9.5);
    if(s.kv){for(const [l,v,b] of s.kv){brk(6);doc.setFont("helvetica",b?"bold":"normal");doc.text(String(l),M,y);doc.text(String(v),W-M,y,{align:"right"});y+=5.5;if(b){doc.setDrawColor(210);doc.line(M,y-4.2,W-M,y-4.2);}}y+=3;}
    if(s.table){const cols=s.table.head.length,ws=s.table.w||Array(cols).fill(1),tw=ws.reduce((a,b)=>a+b,0),xs=[];let x=M;for(const w of ws){xs.push(x);x+=(W-2*M)*w/tw;}
      const right=s.table.right||[];const cell=(row,bold)=>{doc.setFont("helvetica",bold?"bold":"normal");let h=1;
        row.forEach((v,i)=>{const cw=(W-2*M)*ws[i]/tw-2;const txt=doc.splitTextToSize(String(v??""),cw);h=Math.max(h,txt.length);if(right.includes(i))doc.text(txt,xs[i]+cw,y,{align:"right"});else doc.text(txt,xs[i],y);});y+=h*4.4+1.4;};
      brk(10);cell(s.table.head,true);doc.setDrawColor(200);doc.line(M,y-3.6,W-M,y-3.6);
      for(const r of s.table.rows){brk(8);cell(r,false);} if(s.table.foot){doc.line(M,y-3.6,W-M,y-3.6);cell(s.table.foot,true);}y+=3;}
  }
  brk(10);doc.setFontSize(8);doc.setTextColor(120);doc.text("Generado el "+dmy(todayStr())+" · documento de control interno, sin valor fiscal.",M,y+4);
  try{await S.downloads.save({filename,data:doc.output("arraybuffer")});}catch(e){if(!e||!QUIET.includes(e.code))toast("No se pudo descargar el PDF.");}
}

function quincena(key){const [y,m,q]=key.split("-");const ym=y+"-"+m;return q==="Q1"?{key,from:ym+"-01",to:ym+"-15",label:"1ª quincena de "+monthLabel(ym).toLowerCase()}:{key,from:ym+"-16",to:monthEndD(ym),label:"2ª quincena de "+monthLabel(ym).toLowerCase()};}

function qList(){const out=[];let ym=todayStr().slice(0,7);let q=curQ().slice(-2);for(let i=0;i<14;i++){out.push(ym+"-"+q);if(q==="Q2")q="Q1";else{q="Q2";ym=addMonths(ym,-1);}}return out;}
function calcPayroll(key){
  const Q=quincena(key),co=company(),pct=((co.ivss??4)+(co.rpe??0.5)+(co.faov??1))/100;
  return S.employees.filter(e=>e.active!==false).map(e=>{const salary=r2((e.salaryUsd||0)/2);
    const sales=S.sales.filter(s=>s.asesorId===e.id&&inRange(s.date,Q.from,Q.to));
    const comm=r2(sales.reduce((t,s)=>t+(s.items||[]).filter(i=>i.type!=="producto").reduce((x,i)=>x+i.qty*(i.cost||0),0),0));
    const ded=r2(salary*pct);return {employeeId:e.id,name:e.name,role:e.role,salary,comm,ded,net:r2(salary-ded+comm),sales:sales.length};});
}

function openModal(html,onSubmit,onInput,submitLabel){
  $("#dlg").innerHTML=`<form id="mform" novalidate>${html}<p class="err" id="ferr" hidden></p><div class="dlg-a"><button type="button" class="btn btn-o" data-act="close">Cancelar</button><button type="submit" class="btn btn-p" id="fsubmit">${submitLabel||"Guardar"}</button></div></form>`;
  $("#modal").hidden=false;const f=$("#mform");
  f.onsubmit=async e=>{e.preventDefault();if(S.busy)return;const err=$("#ferr");err.hidden=true;
    try{S.busy=true;$("#fsubmit").disabled=true;const msg=await onSubmit(f);closeModal();if(msg)toast(msg);render(true);}
    catch(x){err.textContent=x.userMsg||("No se pudo guardar: "+(x.message||x.code||"error desconocido")+". Inténtalo de nuevo.");err.hidden=false;}
    finally{S.busy=false;const b=$("#fsubmit");if(b)b.disabled=false;}};
  if(onInput){const h=e=>{try{onInput(f,e);}catch(x){}};f.addEventListener("input",h);f.addEventListener("change",h);h(null);}
  const first=f.querySelector("input:not([type=radio]):not([type=checkbox]):not([disabled]),select");if(first)first.focus();
}

/* pagos genéricos: crea movimientos y devuelve las líneas con su movimiento */
async function postPayments(lines,{dir,date,source,refId,concept,extra}){
  const out=[];
  for(const l of lines){const ref=await C("movements").add({dir,date,accountId:l.accountId,method:l.method,amount:l.amount,usd:l.usd,rate:l.rate,source,refId,concept,ref:l.ref,...(extra||{}),createdAt:nowIso()});
    out.push({date,accountId:l.accountId,method:l.method,usd:l.usd,amount:l.amount,rate:l.rate,ref:l.ref,movId:ref.id});}
  return out;
}
function payModalBody(pre){return `<div class="fgrid">${fld(pre+"date","Fecha del pago",inp(pre+"date",`type="date" value="${todayStr()}" max="${todayStr()}"`))}<div class="field"><span class="flabel">Tasa BCV de esa fecha</span><span class="preview num" id="${pre}rate" style="padding:8px 12px"></span></div></div>${payBlock(pre,[{key:"",usd:"",bs:"",ref:""}])}<div id="${pre}st"></div>`;}

function calcTransfer(f,A,B,amt){
  const c=parseNum(val(f,"t_com"))||0,pct=f.querySelector("input[name=t_ct]:checked").value==="pct";const com=r2(pct?amt*c/100:c);
  let credit=amt,rate=null;
  if((A.currency==="VES")!==(B.currency==="VES")){rate=parseNum(val(f,"t_rate"));if(!(rate>0))return {err:"Escribe la tasa para convertir entre $ y Bs.",com,credit:0};credit=A.currency==="VES"?amt/rate:amt*rate;}
  if(amt+com>balance(A)+0.004)return {err:"Saldo insuficiente en la cuenta de origen ("+money(A.currency,balance(A))+").",com,credit};
  return {com,credit:r2(credit),rate};
}

async function finalizeSale(){
  const p=S.pos,T=posTotals(p),rate=bcv(p.date);
  if(!p.cart.length)throw uerr("El pedido está vacío.");
  for(const l of p.cart){const it=itemById(l.itemId);if(it&&it.type==="producto"&&l.qty>(it.stock||0))throw uerr("Existencia insuficiente de «"+it.name+"» ("+(it.stock||0)+" und.).");}
  const lines=parseLines(p.pay,rate),paid=r2(lines.reduce((t,l)=>t+l.usd,0));
  if(paid>T.total+0.004)throw uerr("Los pagos superan el total del pedido.");
  if(T.total-paid>0.004&&!p.credit)throw uerr("Faltan "+usd(r2(T.total-paid))+". Completa el pago o marca «Dejar el saldo a crédito».");
  const client=p.client.trim();
  if(client&&!S.clients.some(c=>c.name.toLowerCase()===client.toLowerCase()))await C("clients").add({name:client,rif:p.rif.trim(),createdAt:nowIso()});
  const number=nextSaleNumber(),ref=C("sales").doc();
  const pays=await postPayments(lines,{dir:"in",date:p.date,source:"venta",refId:ref.id,concept:"Venta "+saleNo(number)+(client?" · "+client:"")});
  const items=p.cart.map(l=>({itemId:l.itemId,name:l.name,qty:l.qty,price:l.price,cost:l.cost||0,type:l.type}));
  const doc={number,date:p.date,client,rif:p.rif.trim(),items,subtotal:T.sub,discount:T.disc,extras:T.ext,net:T.base,iva:T.iva,igtf:T.igtf,total:T.total,cost:T.cost,rate:rate||null,payments:pays,paidUsd:paid,dueDate:T.total-paid>0.004?p.due:null,notes:p.notes.trim(),asesorId:p.asesor||null,createdAt:nowIso()};
  await ref.set(doc);
  for(const l of items){if(l.type!=="producto")continue;const it=itemById(l.itemId);if(!it)continue;
    await C("items").doc(it.id).update({stock:(it.stock||0)-l.qty});
    await C("invlog").add({date:p.date,itemId:it.id,itemName:it.name,type:"salida",qty:l.qty,unitCost:it.cost||0,concept:"Venta "+saleNo(number),refId:ref.id,createdAt:nowIso()});}
  S.pos=newPos();S.pos.stage="done";S.pos.last=ref.id;S.pos.lastData={...doc,id:ref.id};
}
async function deleteSale(id){
  if(!S.sales.some(x=>x.id===id))return;
  for(const m of S.movements.filter(m=>m.refId===id))await C("movements").doc(m.id).delete();
  for(const l of S.invlog.filter(l=>l.refId===id)){const it=itemById(l.itemId);if(it)await C("items").doc(it.id).update({stock:(it.stock||0)+l.qty});await C("invlog").doc(l.id).delete();}
  await C("sales").doc(id).delete();
}

  if(!window.jspdf){toast("No se pudo cargar el generador de PDF. Recarga la página.");return;}
  const {jsPDF}=window.jspdf,co=company(),nw=f==="80";
  const W=nw?80:216,M=nw?5:18,ls=nw?4:5.5;let y=nw?8:22;
  const H=nw?100+(s.items.length*9)+((s.payments||[]).length*ls)+(s.notes?14:0):279;
  const doc=new jsPDF({unit:"mm",format:nw?[W,H]:"letter"});const fs=nw?8:10;
  const ctr=nw?{align:"center"}:undefined,X=nw?W/2:M;

async function csv(name,headers,rows){
  if(!S.downloads)return;const q=v=>typeof v==="number"?String(r2(v)).replace(".",","):'"'+String(v??"").replace(/"/g,'""')+'"';
  const txt="﻿"+[headers.map(q).join(";"),...rows.map(r=>r.map(q).join(";"))].join("\r\n");
  try{await S.downloads.save({filename:name+".csv",data:txt});}catch(e){if(!e||!QUIET.includes(e.code))toast("No se pudo descargar el archivo.");}
}

    return csv("pedidos-"+f+"_"+t,["Pedido","Fecha","Cliente","Detalle","Subtotal","Descuento","Extras","IVA","IGTF","Total","Costo","Pagado","Saldo","Métodos","Tasa BCV"],l.map(s=>[saleNo(s.number),s.date,s.client,(s.items||[]).map(i=>i.qty+"x "+i.name).join(" | "),s.subtotal,s.discount,s.extras,s.iva,s.igtf,s.total,s.cost,s.paidUsd||0,saleSaldo(s),methodsOf(s),s.rate||""]));}
  if(a==="csv-inv")return csv("inventario-"+todayStr(),["Nombre","SKU","Categoría","Tipo","Costo","Precio","Existencia","Valor"],S.items.map(i=>[i.name,i.sku,i.category,i.type,i.cost||0,i.price||0,i.type==="producto"?i.stock||0:"",i.type==="producto"?(i.stock||0)*(i.cost||0):""]));
  if(a==="csv-mov"){const [f,t]=monthRange(S.month);const l=S.movements.filter(m=>inRange(m.date,f,t)&&(S.acct==="todas"||m.accountId===S.acct)).sort((x,y)=>x.date<y.date?-1:1);
    return csv("movimientos-"+S.month,["Fecha","Cuenta","Moneda","Dirección","Origen","Concepto","Método","Referencia","Monto","Equivalente $","Tasa"],l.map(m=>{const ac=acctById(m.accountId);return [m.date,ac?ac.name:"",ac?ac.currency:"",m.dir==="in"?"Entrada":"Salida",(SRC[m.source]||[m.source])[0],m.concept,m.method,m.ref,m.dir==="in"?m.amount:-m.amount,m.dir==="in"?m.usd:-m.usd,m.rate||""];}));}
  if(a==="csv-gas"){const [f,t]=S.screen==="reportes"?[S.rep.from,S.rep.to]:monthRange(S.month);const l=S.expenses.filter(e=>inRange(e.date,f,t)).sort((x,y)=>x.date<y.date?-1:1);
    return csv("gastos-"+f+"_"+t,["Fecha","Nombre","Categoría","Tipo","Monto $","Pagado $","Saldo $","Métodos"],l.map(e=>[e.date,e.name,e.category,e.kind,e.amountUsd,expPaid(e),expSaldo(e),methodsOf(e)]));}

    return csv("libro-diario-"+S.month,["Fecha","Ref.","Concepto","Código","Cuenta","Debe $","Haber $"],rows);}
  if(a==="csv-lventas"){const [f,t]=ivaPeriod();const l=S.sales.filter(s=>inRange(s.date,f,t)).sort((x,y)=>x.number-y.number);
    return csv("libro-ventas-"+f+"_"+t,["Fecha","Pedido","Cliente","RIF","Base imponible $","IVA $","IGTF $","Total $","Tasa BCV"],l.map(s=>[s.date,saleNo(s.number),s.client,s.rif,(s.total||0)-(s.iva||0)-(s.igtf||0),s.iva||0,s.igtf||0,s.total||0,s.rate||""]));}

    db.collection(col).onSnapshot(snap=>{
      S[col]=snap.docs.map(d=>{const o=Object.assign({},d.data());o.id=d.id;return o;});
      if(col==="accounts")S.accounts.sort((a,b)=>(a.createdAt||"")<(b.createdAt||"")?-1:1);
      S.jver++;S.loaded[col]=true;later();
    },err=>{S.loaded[col]=true;toast("Se perdió la conexión con los datos ("+(err&&err.code)+"). Recarga la página.");later();});
  }
  window.claude.use("downloads").then(d=>{S.downloads=d;later();}).catch(()=>{});
})();
})();
</script>
